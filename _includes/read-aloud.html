<!--
  Read Aloud Control Bar Include
  
  Includes CSS and HTML markup for Read Aloud feature.
-->

<link rel="stylesheet" href="/authors-assistant/assets/css/read-aloud.css">

<div data-read-aloud-controls role="toolbox" aria-label="Read aloud controls">
  <span data-read-aloud-label>Read Aloud:</span>
  
  <div data-read-aloud-buttons>
    <button data-action="read" aria-label="Read aloud from the beginning">
      <span>Read</span>
    </button>
    
    <button data-action="pause-resume" aria-label="Pause reading">
      <span>Pause</span>
    </button>
    
    <button data-action="stop" aria-label="Stop reading">
      <span>Stop</span>
    </button>
    
    <button data-action="previous" aria-label="Read previous paragraph">
      <span>← Previous</span>
    </button>
    
    <button data-action="next" aria-label="Read next paragraph">
      <span>Next →</span>
    </button>
  </div>
  
  <select data-action="speed" aria-label="Reading speed">
    <option value="0.75">0.75×</option>
    <option value="1" selected>1×</option>
    <option value="1.25">1.25×</option>
    <option value="1.5">1.5×</option>
  </select>
</div>

<!-- Aria-live status announcements (hidden but announcements screen-read) -->
<div data-read-aloud-status role="status" aria-live="polite" aria-atomic="true"></div>
